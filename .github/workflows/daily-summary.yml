name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 23:07 UTC is 07:07 Asia/Shanghai.
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '7 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_api_key: ${{ steps.check.outputs.has_api_key }}
    steps:
      - id: check
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          if [ -n "$DEEPSEEK" ]; then
            echo "has_api_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK is not configured; daily generation is skipped."
          fi

  daily-summary:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_api_key == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
